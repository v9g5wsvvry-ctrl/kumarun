<title>くまルン</title>

<style>
/* Layout: one centered column. Bear, bubble, fortune card, nickname card, friend badge, TikTok button. */
:root {
  --bg: #f6f7f2;
  --fg: #1f2a24;
  --muted: #5d6b62;
  --nori: #23392d;
  --ume: #d6453d;
  --card: #ffffff;
  --line: #dfe4da;
  --gold: #b9860b;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b16; --fg: #eef2ea; --muted: #a3b0a6; --nori: #0c130f;
    --ume: #ff7a70; --card: #1c2720; --line: #2e3d33; --gold: #e3b341;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131b16; --fg: #eef2ea; --muted: #a3b0a6; --nori: #0c130f;
  --ume: #ff7a70; --card: #1c2720; --line: #2e3d33; --gold: #e3b341;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.6;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.count { text-align: center; color: var(--muted); font-size: 14px; font-weight: 500; }
.count b { color: var(--ume); font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stage { display: inline-block; margin-left: 8px; padding: 1px 10px; border: 1.5px solid var(--ume); color: var(--ume); border-radius: 99px; font-size: 12px; font-weight: 700; }
.bear { width: 260px; max-width: 80%; margin: 0 auto; display: block; border-radius: 24px; border: 3px solid var(--line); }
.bubble {
  background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 16px 18px;
  font-weight: 700; font-size: 18px; text-wrap: balance; position: relative; text-align: center;
}
.bubble::before {
  content: ""; position: absolute; top: -10px; left: 50%; width: 16px; height: 16px; margin-left: -8px;
  background: var(--card); border-left: 2px solid var(--line); border-top: 2px solid var(--line); transform: rotate(45deg);
}
.card { border-radius: 20px; padding: 20px; text-align: center; }
.fortune { background: var(--nori); color: #f3f6ef; }
.fortune small, .nick small { display: block; font-size: 13px; letter-spacing: .12em; opacity: .85; }
.fortune .rank { display: block; font-size: 44px; font-weight: 900; line-height: 1.2; margin: 2px 0; }
.fortune p { margin: 0; font-size: 15px; }
.fortune .lucky { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(243,246,239,.25); font-size: 14px; }
.nick { background: var(--card); border: 2px solid var(--line); }
.nick strong { display: block; font-size: 28px; font-weight: 900; line-height: 1.35; margin: 4px 0; }
.nick.locked { border-style: dashed; color: var(--muted); }
.nick.locked strong { font-size: 20px; }
.friend {
  text-align: center; font-weight: 900; font-size: 18px; color: var(--gold);
  border: 2px solid var(--gold); border-radius: 99px; padding: 10px 16px;
}
.btn {
  display: block; font-family: var(--font); font-size: 16px; font-weight: 700; text-align: center;
  padding: 14px 16px; border-radius: 14px; text-decoration: none; cursor: pointer;
  border: 2px solid var(--ume); background: var(--ume); color: #fff;
}
.btn:focus-visible, .test button:focus-visible { outline: 3px solid var(--ume); outline-offset: 2px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
.room { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.room strong { font-size: 18px; font-weight: 900; }
.room span { color: var(--muted); font-size: 14px; }
.biz { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.biz summary { cursor: pointer; font-weight: 700; }
.biz summary:focus-visible { outline: 3px solid var(--ume); outline-offset: 2px; }
.biz p { margin: 8px 0 0; color: var(--muted); }
.sign small { display: block; text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.signs button { font-family: var(--font); font-size: 14px; font-weight: 700; padding: 8px 4px; min-width: 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; line-height: 1.3; }
.signs button span { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
.signs button[aria-pressed="true"] { border-color: var(--ume); background: var(--ume); color: #fff; }
.signs button[aria-pressed="true"] span { color: #fff; }
.signs button:focus-visible { outline: 3px solid var(--ume); outline-offset: 2px; }
.test { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.test button { font-family: var(--font); font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
@media (prefers-reduced-motion: no-preference) {
  .bear { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
}
</style>

  ["大吉", "いいことが、ひとつ起きそう。気になってたことを、今日やってみよう。"],
  ["中吉", "人との会話から、ヒントが見つかる日。気軽に話してみよう。"],
  ["小吉", "ゆっくりが、ちょうどいい日。休けいを、ちゃんととろう。"],
  ["吉", "おいしいものに、運がある日。ごはんは、ゆっくり味わおう。"],
  ["末吉", "あとから、じわじわ効いてくる日。小さなことを大事にしよう。"]
];
var ITEMS = ["おにぎり", "あたたかいお茶", "青いペン", "ハンカチ", "チョコレート", "メガネふき", "小さなメモ", "イヤホン", "のど飴", "ポケットティッシュ"];
var ADJ = ["ほかほか", "ふわふわ", "のんびり", "きらきら", "もぐもぐ", "にこにこ", "ぴかぴか", "どきどき"];
var NOUN = ["ひだまり", "おにぎり", "こねこ", "ほし", "どんぐり", "まめだいふく", "たいやき", "くも"];

function load() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!s || !Array.isArray(s.days)) s = { days: [], nick: null, off: 0 };
  if (typeof s.off !== "number") s.off = 0;
  return s;
}
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function dateStr(off) {
  var d = new Date(); d.setDate(d.getDate() + off);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function hash(str) {
  var h = 0;
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function stageOf(n) {
  if (n >= 10) return "大親友";
  if (n >= 5) return "なかよし";
  if (n >= 2) return "お友達";
  return "はじめまして";
}

var state = load();
var SIGNS = [["おひつじ座","3/21〜4/19"],["おうし座","4/20〜5/20"],["ふたご座","5/21〜6/21"],["かに座","6/22〜7/22"],["しし座","7/23〜8/22"],["おとめ座","8/23〜9/22"],["てんびん座","9/23〜10/23"],["さそり座","10/24〜11/22"],["いて座","11/23〜12/21"],["やぎ座","12/22〜1/19"],["みずがめ座","1/20〜2/18"],["うお座","2/19〜3/20"]];
SIGNS.forEach(function (g) {
  var b = document.createElement("button");
  b.type = "button"; b.dataset.sign = g[0];
  b.appendChild(document.createTextNode(g[0]));
  var sp = document.createElement("span"); sp.textContent = g[1]; b.appendChild(sp);
  b.addEventListener("click", function () { state.sign = g[0]; render(); });
  document.getElementById("signs").appendChild(b);
});

function render() {
  var today = dateStr(state.off);
  if (state.days.indexOf(today) === -1) state.days.push(today);
  var n = state.days.length;
  if (n >= 2 && !state.nick) {
    state.nick = ADJ[Math.floor(Math.random() * ADJ.length)] + NOUN[Math.floor(Math.random() * NOUN.length)];
  }
  save(state);

  var seed = today + (state.sign || "");
  var f = FORTUNES[hash(seed) % FORTUNES.length];
  var item = ITEMS[hash(seed + "item") % ITEMS.length];
  document.getElementById("fLabel").textContent = "今日の運勢" + (state.sign ? "（" + state.sign + "）" : "");
  var bs = document.querySelectorAll("#signs button");
  for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", bs[i].dataset.sign === state.sign ? "true" : "false");

  document.getElementById("n").textContent = n;
  document.getElementById("stage").textContent = stageOf(n);
  document.getElementById("rank").textContent = f[0];
  document.getElementById("msg").textContent = f[1];
  document.getElementById("lucky").textContent = "ラッキーアイテム：" + item;

  var bubble = n === 1 ? "はじめまして、くまルンだよ。タッチありがとう。今日の運勢だよ🐻"
    : n === 2 ? "また会えたね！きみのあだ名、決めたよ。"
    : n >= 10 ? n + "日も会ってくれたね。大親友だ！"
    : "また来てくれたんだ。今日の運勢だよ🐻";
  document.getElementById("bubble").textContent = bubble;

  var card = document.getElementById("nickCard");
  if (n >= 2) {
    card.classList.remove("locked");
    document.getElementById("nickLabel").textContent = "くまルンが決めた、きみのあだ名";
    document.getElementById("nick").textContent = "「" + state.nick + "」";
    document.getElementById("nickNote").textContent = "";
  } else {
    card.classList.add("locked");
    document.getElementById("nickLabel").textContent = "きみのあだ名";
    document.getElementById("nick").textContent = "あした会うと、決まるよ";
    document.getElementById("nickNote").textContent = "違う日にもう一度タッチしてね。";
  }
  document.getElementById("friend").hidden = n < 2;
}

document.getElementById("tiktok").href = TIKTOK_URL;
if (location.hash === "#test") {
  document.getElementById("test").hidden = false;
  document.getElementById("nextDay").addEventListener("click", function () { state.off += 1; render(); });
  document.getElementById("reset").addEventListener("click", function () { state = { days: [], nick: null, off: 0 }; render(); });
}
render();
</script>

<script data-goatcounter="https://kumarun.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
